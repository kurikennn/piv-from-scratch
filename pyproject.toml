[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pivfs"
version = "0.1.0"
description = "Particle Image Velocimetry from scratch, with a synthetic ground-truth generator"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = ["numpy", "scipy", "matplotlib", "pillow"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Greek letters and typographic symbols are intended
